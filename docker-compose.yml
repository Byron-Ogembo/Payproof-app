version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: payproof-db
    restart: always
    environment:
      POSTGRES_USER: payproof
      POSTGRES_PASSWORD: payproofpassword
      POSTGRES_DB: payproof
    ports:
      - "5432:5432"
    volumes:
      - payproof_pgdata:/var/lib/postgresql/data

volumes:
  payproof_pgdata:
